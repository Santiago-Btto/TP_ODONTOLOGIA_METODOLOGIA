# Entorno de desarrollo local. Las credenciales son ficticias y sólo válidas en este compose.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
      POSTGRES_DB: turnos
    ports:
      - "5432:5432"
    volumes:
      - ./backend/scripts/crear-base-test.sql:/docker-entrypoint-initdb.d/01-crear-base-test.sql:ro
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  bootstrap:
    build: ./backend
    command: python -m app.infrastructure.bootstrap_demo
    environment:
      DATABASE_URL: postgresql+psycopg://turnos:turnos@db:5432/turnos
      JWT_SECRET: ${JWT_SECRET:?Ejecutar python backend/scripts/preparar_entorno.py}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Ejecutar python backend/scripts/preparar_entorno.py}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://turnos:turnos@db:5432/turnos
      TEST_DATABASE_URL: postgresql+psycopg://turnos:turnos@db:5432/turnos_test
      REDIS_URL: redis://redis:6379/0
      # Valores locales generados por preparar_entorno.py; .env está ignorado por Git.
      JWT_SECRET: ${JWT_SECRET:?Ejecutar python backend/scripts/preparar_entorno.py}
      JWT_EXPIRA_MINUTOS: ${JWT_EXPIRA_MINUTOS:-30}
    ports:
      - "8000:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.infrastructure.worker_recordatorios
    # Reintenta solo ante caídas de Redis; el reinicio cubre cualquier otra salida inesperada.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://turnos:turnos@db:5432/turnos
      REDIS_URL: redis://redis:6379/0
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  datos-postgres:
